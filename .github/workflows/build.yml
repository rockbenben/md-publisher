name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# electron-builder publishes the release with GITHUB_TOKEN. Without this the
# default workflow token is read-only and every tagged build fails at publish.
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
      fail-fast: false
      # **三条腿不能同时发版**：electron-builder 的 GitHub publisher 默认建的是**草稿**
      # （app-builder-lib/out/publish/gitHubPublisher.js 里 `this.releaseType = "draft"`），
      # 三条腿同时往同一个 tag 上发布会撞成同一个 tag 出现两条 release，产物被随机拆成两半
      # ——repo-radar 的 release.yml 头注释记的就是这个坑。
      # 串行跑：第一条腿建出那条草稿，后两条找到它往里传产物。
      max-parallel: 1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Electron 44 requires Node >= 22.12.0; Vite 8 requires
          # ^20.19.0 || >=22.12.0.
          node-version: 22
          cache: npm
      - name: Install root deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Install web deps
        # `npm ci`, not `install`: web/ has its own lockfile and all-caret
        # ranges, so `install` could build a tagged release from versions that
        # were never committed or reviewed.
        run: npm run web:ci
      - name: Build web
        run: npm run web:build
      - name: Build & publish
        run: npx electron-builder --publish onTagOrDraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: md-publisher-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

  # 把那条草稿发布出去，并显式把它标成 latest。
  #
  # 单独一条 job，不放在矩阵里：矩阵有三条腿，三条腿都去发布会打架。
  # `needs: build` 保证三个平台的产物都进去了才轮到它。
  publish:
    name: 发布这个 release，并把 latest 指到它
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ⚠️ **不能只发草稿了事**：草稿转成已发布时，GitHub **不会**重算
      # `releases/latest` 指向谁——2026-10-20 在 rclone-deck 上撞到过一次：release 已经是
      # `draft=false`、`prerelease=false`、`published_at` 也填上了，`releases/latest`
      # 却仍返回旧版本，端点 `releases/latest/download/latest.json` 于是 **404**
      # （旧 release 里没有 `latest.json`）。所以这里一次 PATCH 同时给
      # `draft=false` 与 `make_latest=true`，不靠 GitHub 自己挪。
      #
      # 应用内更新器读的就是 `releases/latest`（electron/update-check.cjs 直接打这个地址），
      # 指错就等于没发版。
      #
      # 判据是**看 API 指到谁**，不是看 release 的字段：字段全对而指针没挪，端点照样 404。
      # CDN 那层重定向还会再滞后几分钟，属正常——这里判 API，不判 CDN。
      - name: 发布并把 latest 指到它
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # ⚠️ **不能用 `releases/tags/<tag>` 找这条 release**：那个端点**不返回草稿**。
          # 草稿只能从 release 列表里捞——列表按创建时间倒序，新建的草稿总在第一页。
          id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                 --jq "first(.[] | select(.tag_name == \"${tag}\") | .id)")"
          if [ -z "$id" ]; then
            echo "::error::没找到 tag ${tag} 对应的 release"
            exit 1
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" \
            -F draft=false -f make_latest=true > /dev/null
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [ "$latest" != "$tag" ]; then
            echo "::error::releases/latest 指着 ${latest}，不是 ${tag}"
            exit 1
          fi
          echo "release ${tag} 已发布，releases/latest 指向它"

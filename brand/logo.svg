<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="md-publisher 印章">
  <title>md-publisher — 一稿多发</title>
  <!--
    稿与分发 — one manuscript, many destinations.

    Left: a cinnabar chop whose interior is knocked out into three ruled lines.
    The square is a 印章 (a Chinese seal is square, and the app's Postmark stamps
    with the same cinnabar), the ruled interior makes it the 稿 — so the mark is
    both "the seal" and "the article", and −3° gives it the hand-pressed tilt the
    interface already uses.

    Right: three solid squares in a fanned column with falling opacity — the
    platforms it lands on, and the fall-off is the fan.

    Why it is legible: at 16px the ruled interior collapses into a notch and the
    four shapes stop reading as confetti the way a scattered four-square fan
    does. The small-size variant (logo-mark-small.svg) drops the rules entirely
    rather than trusting them to survive.
  -->
  <defs>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.15" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g fill="#C23B2E">
    <!-- the chop — the manuscript, hand-pressed -->
    <rect x="6" y="27" width="46" height="46" rx="4" transform="rotate(-3 29 50)" filter="url(#ink)"/>
    <!-- the destinations, fanning out with falling opacity -->
    <rect x="64" y="6"  width="32" height="27" rx="3.5" transform="rotate(-5 80 19.5)"/>
    <rect x="64" y="36" width="32" height="27" rx="3.5" transform="rotate(1.5 80 49.5)" opacity=".86"/>
    <rect x="64" y="66" width="32" height="27" rx="3.5" transform="rotate(6 80 79.5)" opacity=".72"/>
  </g>
  <!-- ruled interior — knocked out to the paper colour, as 阳刻 lettering is -->
  <g fill="#F6F1E7" transform="rotate(-3 29 50)">
    <rect x="15" y="38" width="28" height="5" rx="2.5"/>
    <rect x="15" y="48" width="28" height="5" rx="2.5"/>
    <rect x="15" y="58" width="17" height="5" rx="2.5"/>
  </g>
</svg>
